# Size ratchet, read by verifyArtifactBudget on every release build.
# 0.5.3 with the shared release gates built at 3,418,596 bytes APK and
# 3,107,120 bytes dex once the edge-to-edge helper left the shrunk output.
# A bigger artifact is a decision, not an accident: raise a line here in the
# same commit as the change that needs it, with the reason next to it.
apk.maxBytes=3600000
dex.maxBytes=3300000
# 0.5.3 bundle: 3,929,483 bytes.
aab.maxBytes=4100000
