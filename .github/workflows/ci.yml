name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request that supersedes an in-flight run should cancel it rather than
# queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the token should not be able to.
# Without this the default token is writable, and a compromised build dependency
# would inherit that write access on a fork PR.
permissions:
  contents: read

jobs:
  build:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    # A wedged Gradle daemon otherwise runs until the six-hour ceiling.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # earslate has no backend and no build-time secrets: a clean checkout
      # must build without any configuration at all. If this step ever needs a
      # key added, something has gone wrong with the architecture.
      - name: Build, test and lint
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      # Gradle skips a task it considers up to date, so a green run that
      # executed nothing looks exactly like a green run that executed
      # everything. Assert the suites actually ran and that the count has not
      # quietly collapsed.
      - name: Verify the tests actually executed
        run: |
          results=app/build/test-results/testDebugUnitTest
          if [ ! -d "$results" ]; then
            echo "::error::no test results directory — the test task did not run"
            exit 1
          fi
          total=0
          for f in "$results"/TEST-*.xml; do
            [ -e "$f" ] || { echo "::error::no TEST-*.xml results were produced"; exit 1; }
            n=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            echo "  $(basename "$f"): $n tests"
            total=$((total + n))
          done
          echo "total tests executed: $total"
          # The floor tracks the real count. It sat at 20 while the suite grew to
          # 65, which meant two thirds of the tests could vanish and this gate —
          # the gate whose entire job is to notice exactly that — would still go
          # green. A floor far below reality is not a safety margin, it is a
          # disabled check that reads as an enabled one.
          #
          # 86 against the current 95 leaves room to delete a genuinely obsolete
          # test without a CI edit, and no room to lose a suite. Raise it when
          # the count rises. (70/79, then 77/86, then this.) Raising the floor
          # is part of adding tests, not a follow-up: the batch that added the
          # redaction suite left it behind, which is exactly how a floor drifts
          # far enough below reality to stop being a check at all.
          MIN_TESTS=86
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::only $total tests ran; expected at least $MIN_TESTS. Suites have been lost or skipped."
            exit 1
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: earslate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
