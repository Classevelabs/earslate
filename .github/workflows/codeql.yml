name: CodeQL

# CI proves the app builds and behaves. It says nothing about whether a change
# introduced a taint path — a provider string reaching a log, a key reaching an
# intent, a path assembled from something the user typed. That is what this
# looks for, and it is the one class of bug the test floor cannot catch because
# nobody writes a test for a vulnerability they have not thought of yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rules improve after the code is written, so the same commit is worth
    # rescanning. Wednesday, off the hour, away from the Dependabot sweep.
    - cron: "42 4 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      # Writing the findings back to the Security tab is the entire point.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This was written as build-mode: none first, and it went green while
      # extracting nothing. The only Java it had found was the accessor code
      # Gradle generates under .gradle, so the run reported four findings about
      # its own scaffolding and none about the app. Excluding that directory is
      # what surfaced it: the next run failed outright with "could not process
      # any of it". Kotlin needs a real compile, so it gets one.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          config: |
            paths-ignore:
              - '.gradle/**'
              - 'app/src/test/**'

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
