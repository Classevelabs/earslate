# earslate for iOS — build and wire-format tests.
#
# The iOS client lived only inside a personal backup repository: it was in no
# product repo, had no CI, and had no tests. Nine hundred lines of working
# app — live Gemini client, audio capture and playback — one disk failure from
# gone, and unverifiable by anyone but the person holding that disk.
#
# The first cross-platform comparison found a bug that made Gemini translation
# impossible: the setup frame put transcription inside generationConfig, which
# the server rejects by closing the socket with 1007. Android had shipped the
# same mistake, measured it on-device, fixed it and pinned it. iOS never
# learned. This is what makes that comparison automatic.
#
# Unsigned and simulator-only on purpose. Shipping to the App Store needs an
# Apple Developer Program membership that does not exist yet; building and
# testing needs neither, so neither waits for it.

name: iOS

on:
  # macOS runners bill at a 10x minute multiplier. On 2026-08-11 the account's
  # monthly Actions allowance ran out; prose changes under ios/ no longer buy
  # a full simulator build.
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # xcodegen emits a project format that Xcode 15 on macos-14 refuses with a
    # bare "Unable to read project"; macos-15 carries Xcode 16.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Regression guard: no ClassEve endpoint may reappear in iOS code.
      #
      # Until 0.4.4 this client minted its credential from
      # POST https://api.classeve.com/v1/earslate/session. That route was
      # deleted when Android moved to bring-your-own-key in 0.4.0 — the Worker
      # has no earslate handler and migration 00052 dropped the product — so it
      # answered 404 and the app could not start a single session.
      #
      # Every step below passed throughout: the wire-format tests assert the
      # SHAPE of the setup frame and the build proves it compiles. Neither has
      # any opinion about whether the credential source exists, so CI certified
      # a dead app as green, which is worse than red because it stops anybody
      # looking. This step is the missing opinion.
      #
      # Comment lines are excluded on purpose: the reason for this rule is
      # documented in BootstrapClient.swift and naming the dead URL there is
      # how the next person learns why, not a reintroduction of it.
      - name: Reject any ClassEve endpoint in iOS code
        run: |
          # The exclusion is anchored to the start of grep's "path:line:content"
          # output. An unanchored ':[[:space:]]*//' looks right and is not: it
          # also matches the '://' inside any URL, so it silently discarded the
          # exact lines this gate exists to find. Caught by planting one.
          hits=$(grep -rn "v1/earslate/session\|api\.classeve\.com" --include=*.swift . \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::iOS references a ClassEve endpoint. earslate has no backend; \
          credentials are minted on-device from the user's own key."
            exit 1
          fi
          echo "no ClassEve endpoint references in iOS code"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Tests before the build: they are pure JSON shaping, so a wire-format
      # regression fails in seconds rather than after a full app compile.
      - name: Wire-format tests
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys,itertools; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for x in itertools.chain(*d.values()) if x.get('isAvailable')))")
          echo "simulator: $DEST"
          xcodebuild test \
            -project EarslateiOS.xcodeproj \
            -scheme EarslateTests \
            -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EarslateiOS.xcodeproj \
            -scheme Earslate \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
